<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>B1F 360° Panorama Tour</title>

  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/pannellum@2.5.7/build/pannellum.css"
  >
  <script
    src="https://cdn.jsdelivr.net/npm/pannellum@2.5.7/build/pannellum.js">
  </script>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #111;
      font-family: Arial, "Helvetica Neue", sans-serif;
    }

    #panorama {
      width: 100%;
      height: 100%;
    }

    /* 下部のパノラマ切替タブ */
    .scene-menu {
      position: fixed;
      z-index: 20;
      left: 50%;
      bottom: 18px;
      transform: translateX(-50%);
      display: flex;
      gap: 8px;
      max-width: calc(100vw - 24px);
      padding: 8px;
      overflow-x: auto;
      background: rgba(0, 0, 0, 0.66);
      border-radius: 10px;
      backdrop-filter: blur(5px);
    }

    .scene-button {
      flex: 0 0 auto;
      min-width: 145px;
      padding: 10px 14px;
      border: 1px solid rgba(255,255,255,.65);
      border-radius: 7px;
      background: rgba(30,30,30,.86);
      color: #fff;
      font-size: 14px;
      cursor: pointer;
    }

    .scene-button:hover,
    .scene-button.active {
      background: #fff;
      color: #111;
    }

    /* 右上の平面図 */
    .floorplan-panel {
      position: fixed;
      z-index: 30;
      top: 18px;
      right: 18px;
      width: clamp(210px, 22vw, 280px);
      padding: 8px;
      background: rgba(255,255,255,.94);
      border-radius: 10px;
      box-shadow: 0 3px 18px rgba(0,0,0,.38);
    }

    .floorplan-header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 10px;
      margin: 0 2px 8px;
    }

    .floorplan-title {
      margin: 0;
      font-size: 13px;
      font-weight: 700;
      color: #111;
    }

    .floorplan-current {
      margin: 0;
      font-size: 10px;
      color: #444;
    }

    .floorplan-wrap {
      position: relative;
      width: 100%;
      overflow: hidden;
      border: 1px solid #d0d0d0;
      border-radius: 6px;
      background: #fff;
    }

    .floorplan-wrap img {
      display: block;
      width: 100%;
      height: auto;
    }

    /* 平面図上の地点マーカー */
    .plan-marker {
      position: absolute;
      width: 28px;
      height: 28px;
      transform: translate(-50%, -50%);
      border: 2px solid #fff;
      border-radius: 50%;
      background: #164f7d;
      color: #fff;
      font-size: 10px;
      font-weight: 700;
      line-height: 24px;
      text-align: center;
      cursor: pointer;
      box-shadow: 0 2px 7px rgba(0,0,0,.48);
      transition:
        transform .18s ease,
        background .18s ease,
        color .18s ease,
        box-shadow .18s ease;
    }

    .plan-marker:hover {
      transform: translate(-50%, -50%) scale(1.10);
    }

    .plan-marker.active {
      background: #ffd400;
      color: #111;
      border-color: #111;
      transform: translate(-50%, -50%) scale(1.16);
      box-shadow:
        0 0 0 4px rgba(255,212,0,.30),
        0 3px 10px rgba(0,0,0,.5);
    }


    .floorplan-wrap {
      max-height: 42vh;
    }

    .floorplan-wrap img {
      max-height: 42vh;
      object-fit: contain;
    }

    @media (max-width: 800px) {
      .floorplan-panel {
        top: 10px;
        right: 10px;
        width: clamp(180px, 42vw, 230px);
        padding: 7px;
      }

      .floorplan-title {
        font-size: 13px;
      }

      .floorplan-current {
        font-size: 10px;
      }

      .plan-marker {
        width: 30px;
        height: 30px;
        line-height: 26px;
        font-size: 11px;
      }

      .scene-button {
        min-width: 125px;
        padding: 9px 11px;
        font-size: 13px;
      }
    }
  </style>
</head>

<body>
  <div id="panorama"></div>

  <aside class="floorplan-panel" aria-label="B1F撮影位置平面図">
    <div class="floorplan-header">
      <p class="floorplan-title">B1F 撮影位置</p>
      <p class="floorplan-current" id="floorplanCurrent">
        panorama17.jpg
      </p>
    </div>

    <div class="floorplan-wrap">
      <img src="floorplan.png" alt="B1F平面図">

      <button
        class="plan-marker active"
        data-scene="scene17"
        style="left: 39.79%; top: 33.46%;"
        aria-label="panorama17.jpgを表示">
        17
      </button>

      <button
        class="plan-marker"
        data-scene="scene184"
        style="left: 44.85%; top: 77.59%;"
        aria-label="panorama184.jpgを表示">
        184
      </button>

      <button
        class="plan-marker"
        data-scene="scene210"
        style="left: 50.6%; top: 77.59%;"
        aria-label="panorama210.jpgを表示">
        210
      </button>
    </div>
  </aside>

  <nav class="scene-menu" aria-label="パノラマ切替">
    <button class="scene-button active" data-scene="scene17">
      panorama17.jpg
    </button>
    <button class="scene-button" data-scene="scene184">
      panorama184.jpg
    </button>
    <button class="scene-button" data-scene="scene210">
      panorama210.jpg
    </button>
  </nav>

  <script>
    const sceneNames = {
      scene17: "panorama17.jpg",
      scene184: "panorama184.jpg",
      scene210: "panorama210.jpg"
    };

    const viewer = pannellum.viewer("panorama", {
      default: {
        firstScene: "scene17",
        autoLoad: true,
        sceneFadeDuration: 700,
        showControls: true,
        showFullscreenCtrl: true,
        compass: false
      },

      scenes: {
        scene17: {
          title: "panorama17.jpg",
          type: "equirectangular",
          panorama: "panorama17.jpg",
          yaw: 0,
          pitch: 0,
          hfov: 100
        },

        scene184: {
          title: "panorama184.jpg",
          type: "equirectangular",
          panorama: "panorama184.jpg",
          yaw: 0,
          pitch: 0,
          hfov: 100
        },

        scene210: {
          title: "panorama210.jpg",
          type: "equirectangular",
          panorama: "panorama210.jpg",
          yaw: 0,
          pitch: 0,
          hfov: 100
        }
      }
    });

    const sceneButtons = document.querySelectorAll(".scene-button");
    const planMarkers = document.querySelectorAll(".plan-marker");
    const floorplanCurrent = document.getElementById("floorplanCurrent");

    function loadScene(sceneId) {
      if (viewer.getScene() !== sceneId) {
        viewer.loadScene(sceneId);
      }
    }

    sceneButtons.forEach((button) => {
      button.addEventListener("click", () => {
        loadScene(button.dataset.scene);
      });
    });

    planMarkers.forEach((marker) => {
      marker.addEventListener("click", () => {
        loadScene(marker.dataset.scene);
      });
    });

    viewer.on("scenechange", (sceneId) => {
      sceneButtons.forEach((button) => {
        button.classList.toggle(
          "active",
          button.dataset.scene === sceneId
        );
      });

      planMarkers.forEach((marker) => {
        marker.classList.toggle(
          "active",
          marker.dataset.scene === sceneId
        );
      });

      floorplanCurrent.textContent = sceneNames[sceneId] || "";
    });
  </script>
</body>
</html>
